
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Focus</title>
<meta name="theme-color" content="#0f766e"/>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial, sans-serif; margin: 0; background:#0b1220; color:#e5e7eb; }
header { padding:16px; background:#0f766e; text-align:center; font-weight:bold; }
section { padding:16px; }
button { padding:10px 14px; border:none; border-radius:8px; background:#22c55e; color:#052e16; font-weight:bold; }
input, select { padding:8px; border-radius:6px; border:none; }
.card { background:#111827; padding:12px; border-radius:12px; margin-bottom:12px; }
.small { font-size:12px; color:#9ca3af; }
.timer { font-size:40px; text-align:center; margin:16px 0; }
.progress { height:8px; background:#1f2937; border-radius:8px; overflow:hidden; }
.bar { height:8px; background:#22c55e; width:0%; }
</style>
</head>
<body>
<header>NEET Focus – Daily Study</header>

<section class="card">
<div class="small">Today</div>
<div id="today"></div>
</section>

<section class="card">
<h3>Add Task</h3>
<input id="task" placeholder="e.g., Physics – Ray Optics" style="width:100%"><br><br>
<select id="subject">
<option>Physics</option><option>Chemistry</option><option>Biology</option>
</select>
<input id="minutes" type="number" value="60" style="width:80px"> min
<button onclick="addTask()">Add</button>
</section>

<section class="card">
<h3>Today's Tasks</h3>
<div id="tasks"></div>
</section>

<section class="card">
<h3>Study Timer</h3>
<div class="timer" id="timer">50:00</div>
<button onclick="start()">Start 50 min</button>
<button onclick="reset()">Reset</button>
</section>

<section class="card">
<h3>Daily Progress</h3>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="small"><span id="done">0</span> / <span id="total">0</span> tasks completed</div>
</section>

<script>
const key='neet_tasks';
const todayEl=document.getElementById('today');
todayEl.innerText=new Date().toDateString();

function load(){ return JSON.parse(localStorage.getItem(key)||'[]'); }
function save(t){ localStorage.setItem(key, JSON.stringify(t)); render(); }

function addTask(){
 const t=load();
 t.push({name:task.value, subject:subject.value, min:+minutes.value, done:false});
 save(t); task.value='';
}

function toggle(i){
 const t=load(); t[i].done=!t[i].done; save(t);
}

function render(){
 const t=load();
 const el=document.getElementById('tasks');
 el.innerHTML='';
 let d=0;
 t.forEach((x,i)=>{
  if(x.done) d++;
  el.innerHTML+=`<div>
   <input type='checkbox' ${x.done?'checked':''} onchange='toggle(${i})'>
   ${x.name} <span class='small'>(${x.subject}, ${x.min}m)</span>
  </div>`;
 });
 document.getElementById('done').innerText=d;
 document.getElementById('total').innerText=t.length;
 document.getElementById('bar').style.width=(t.length? (d/t.length*100):0)+'%';
}
render();

let sec=3000, id=null;
function start(){
 if(id) return;
 id=setInterval(()=>{
  if(sec<=0){ clearInterval(id); id=null; alert('Session complete!'); return;}
  sec--; draw();
 },1000);
}
function reset(){ clearInterval(id); id=null; sec=3000; draw(); }
function draw(){
 const m=Math.floor(sec/60).toString().padStart(2,'0');
 const s=(sec%60).toString().padStart(2,'0');
 document.getElementById('timer').innerText=`${m}:${s}`;
}
draw();
</script>
</body>
</html>
